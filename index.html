<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Terminal v1.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; width:100%; }
  body {
    background:#000;
    color:#00ff41;
    font-family:'Courier New', Courier, monospace;
    font-size:13px;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:6px;
    overflow:hidden;
  }
  #terminal {
    width:100%;
    max-width:700px;
    background:#000;
    border:2px solid #00ff41;
    box-shadow:0 0 18px #00ff41aa, 0 0 40px #00ff4133;
    padding:12px 14px;
    height:98vh;
    display:flex;
    flex-direction:column;
  }
  .scanline {
    pointer-events:none;
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    background:repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
    );
    z-index:999;
  }
  #out {
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    margin-bottom:6px;
    scroll-behavior:smooth;
  }
  #out::-webkit-scrollbar { width:3px; }
  #out::-webkit-scrollbar-thumb { background:#00ff4155; }
  .line {
    margin:2px 0;
    white-space:pre-wrap;
    word-break:break-all;
    line-height:1.55;
    font-size:clamp(11px, 2.8vw, 14px);
  }
  .cyan   { color:#00ffff; }
  .yellow { color:#ffe600; }
  .red    { color:#ff3c3c; }
  .green  { color:#00ff41; }
  .dim    { color:#007a20; }
  .bold   { font-weight:bold; }

  #input-row {
    display:flex;
    align-items:center;
    border-top:1px solid #00ff4166;
    padding-top:6px;
    gap:5px;
    flex-shrink:0;
  }
  #input-prompt {
    color:#00ffff;
    white-space:nowrap;
    font-size:clamp(11px, 2.8vw, 14px);
  }
  #cmd-input {
    flex:1;
    background:#000;
    color:#00ff41;
    border:none;
    outline:none;
    font-family:'Courier New', Courier, monospace;
    font-size:clamp(11px, 2.8vw, 14px);
    caret-color:#00ff41;
    min-width:0;
    /* prevent iOS zoom on focus */
    font-size:16px;
  }
  /* fix iOS zoom: keep display size small via transform */
  @media (max-width: 600px) {
    #cmd-input { font-size:16px; }
    .line { font-size:12px; }
    #input-prompt { font-size:12px; }
  }

  #timer-bar {
    display:none;
    background:#001a00;
    border:1px solid #00ff41;
    padding:4px 8px;
    margin-bottom:5px;
    font-size:clamp(10px,2.5vw,12px);
    color:#00ffff;
    text-align:center;
    letter-spacing:1px;
    flex-shrink:0;
    word-break:break-all;
  }

  .bar-row {
    display:flex;
    align-items:center;
    gap:4px;
    margin:2px 0;
    flex-wrap:wrap;
  }
  .bar-outer {
    flex:1;
    min-width:80px;
    max-width:180px;
    background:#001a00;
    border:1px solid #00ff41;
    height:12px;
  }
  .bar-pct { width:32px; text-align:right; color:#00ff41; font-size:11px; }
  .bar-ok  { color:#00ffff; margin-left:3px; font-size:11px; }

  /* ── Main row: output + panel ── */
  #main-row {
    flex:1;
    display:flex;
    flex-direction:row;
    gap:5px;
    overflow:hidden;
    min-height:0;
    margin-bottom:6px;
  }
  #out {
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
    min-width:0;
  }
  #out::-webkit-scrollbar { width:3px; }
  #out::-webkit-scrollbar-thumb { background:#00ff4155; }

  /* ── Info Panel (inside terminal, right side) ── */
  #info-panel {
    display:none;
    width:120px;
    flex-shrink:0;
    background:#000d00;
    border:1px solid #00ff4155;
    border-radius:2px;
    padding:5px 5px 4px 5px;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    font-family:'Courier New',Courier,monospace;
    font-size:8px;
    color:#00ff41;
  }
  #info-panel::-webkit-scrollbar { width:2px; }
  #info-panel::-webkit-scrollbar-thumb { background:#00ff4144; }
  .sp-title {
    color:#ff3c3c;
    font-size:8px;
    font-weight:bold;
    text-align:center;
    border-bottom:1px solid #ff3c3c55;
    padding-bottom:3px;
    margin-bottom:3px;
    letter-spacing:1px;
  }
  .sp-section {
    color:#00ffff;
    font-size:7px;
    font-weight:bold;
    margin:4px 0 1px 0;
    border-left:2px solid #ff3c3c;
    padding-left:3px;
    letter-spacing:0.5px;
  }
  .sp-row {
    font-size:7.5px;
    color:#00ff41;
    padding:1px 0;
    word-break:break-all;
    border-bottom:1px solid #00ff4115;
    line-height:1.4;
  }
  .sp-row.locked  { color:#ff3c3c; }
  .sp-row.removed { color:#007a20; text-decoration:line-through; }
  .sp-row.cyan-row{ color:#00ffff; }
  .sp-status {
    text-align:center;
    margin-top:4px;
    font-size:7px;
    font-weight:bold;
    color:#ff3c3c;
    border:1px solid #ff3c3c44;
    padding:2px 0;
    letter-spacing:1px;
    animation: spblink 1s step-start infinite;
  }
  @keyframes spblink { 50%{ opacity:0; } }
</style>
</head>
<body>
<div class="scanline"></div>
<div id="terminal">
  <div id="timer-bar">⏱ Remaining: --:--</div>
  <div id="main-row">
    <div id="out"></div>
    <div id="info-panel">
      <div class="sp-title">⚠ LOCKOUT</div>
      <div id="sp-loc-sec"  class="sp-section" style="display:none">📍 LOCATION</div>
      <div id="sp-loc"></div>
      <div id="sp-users-sec" class="sp-section" style="display:none">👤 USERS</div>
      <div id="sp-users"></div>
      <div id="sp-nums-sec" class="sp-section" style="display:none">📞 NUMBERS</div>
      <div id="sp-nums"></div>
      <div id="sp-social-sec" class="sp-section" style="display:none">🔗 SOCIAL</div>
      <div id="sp-social"></div>
      <div id="sp-dev-sec"  class="sp-section" style="display:none">💻 DEVICES</div>
      <div id="sp-dev"></div>
      <div id="sp-files-sec" class="sp-section" style="display:none">🗂 FILES</div>
      <div id="sp-files"></div>
      <div id="sp-status" class="sp-status" style="display:none">◉ LOCKED OUT</div>
    </div>
  </div>
  <div id="input-row">
    <span id="input-prompt">root@cyber:~$&nbsp;</span>
    <input id="cmd-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" placeholder="Type and press Enter..." />
  </div>
</div>

<script>
const out      = document.getElementById('out');
const inp      = document.getElementById('cmd-input');
const timerBar = document.getElementById('timer-bar');
const inpRow   = document.getElementById('input-row');

// ── Info Panel refs ──
const infoPanel    = document.getElementById('info-panel');
const spUsers      = document.getElementById('sp-users');
const spUsersSec   = document.getElementById('sp-users-sec');
const spNums       = document.getElementById('sp-nums');
const spNumsSec    = document.getElementById('sp-nums-sec');
const spSocial     = document.getElementById('sp-social');
const spSocialSec  = document.getElementById('sp-social-sec');
const spLoc        = document.getElementById('sp-loc');
const spLocSec     = document.getElementById('sp-loc-sec');
const spDev        = document.getElementById('sp-dev');
const spDevSec     = document.getElementById('sp-dev-sec');
const spFiles      = document.getElementById('sp-files');
const spFilesSec   = document.getElementById('sp-files-sec');
const spStatus     = document.getElementById('sp-status');

const LOCATIONS = ['HYDERABAD','SAMSABAD','SECUNDERABAD','RANGAPUR','ANDHRA PRADESH','KUTHALAM','MEDAK','RESTAURANT'];

function spShow(){ infoPanel.style.display='block'; }
function spHide(){
  infoPanel.style.display='none';
  [spUsers,spNums,spSocial,spLoc,spDev,spFiles].forEach(el=>el.innerHTML='');
  [spUsersSec,spNumsSec,spSocialSec,spLocSec,spDevSec,spFilesSec].forEach(el=>el.style.display='none');
  spStatus.style.display='none';
}

function spAddRow(container, secEl, text, cls=''){
  secEl.style.display='block';
  const d=document.createElement('div');
  d.className='sp-row'+(cls?' '+cls:'');
  d.textContent=text;
  container.appendChild(d);
  return d;
}

function spAddUser(name){ spAddRow(spUsers, spUsersSec, '✗ '+name, 'locked'); }
function spAddNum(num)  { return spAddRow(spNums, spNumsSec, num); }
function spAddSocial(name){ return spAddRow(spSocial, spSocialSec, '• '+name); }
function spAddLoc(loc)  { spAddRow(spLoc, spLocSec, '📍 '+loc, 'cyan-row'); }
function spAddDev(name, removed=false){ return spAddRow(spDev, spDevSec, (removed?'✗ ':'◈ ')+name, removed?'removed':''); }
function spAddFile(text, removed=false){ return spAddRow(spFiles, spFilesSec, text, removed?'removed':'locked'); }
function spSetStatus(on){ spStatus.style.display=on?'block':'none'; }

function spMarkRemoved(el, text){ if(el){ el.classList.add('removed'); el.textContent='✗ '+text; } }

inp.focus();
document.body.addEventListener('click', ()=>inp.focus());
document.body.addEventListener('touchend', ()=>{ inp.focus(); }, {passive:true});

// Mobile keyboard open hone par scroll fix
inp.addEventListener('focus', ()=>{
  setTimeout(()=>{ scroll(); }, 400);
});

const s = ms => new Promise(r => setTimeout(r, ms));
let running = false;
let timerInterval = null;
let busy = false;

// ── Helpers ──
function scroll(){ out.scrollTop = out.scrollHeight; }

function add(html, cls=''){
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  d.innerHTML = html;
  out.appendChild(d);
  scroll();
  return d;
}

async function type(text, cls='', delay=90){
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  out.appendChild(d);
  for(let c of text){ d.textContent += c; scroll(); await s(delay); }
}

async function bar(label, steps=22, dt=200, red=false){
  const uid = Math.random().toString(36).slice(2,8);
  const bc = red ? '#ff3c3c' : '#00ff41';
  const lc = red ? '#ff3c3c' : '#00ffff';
  const row = document.createElement('div');
  row.className = 'bar-row';
  row.innerHTML = `<span style="min-width:170px;color:${lc}">${label}</span>
    <div class="bar-outer"><div id="bi${uid}" style="height:100%;background:${bc};box-shadow:0 0 5px ${bc};width:0%"></div></div>
    <span class="bar-pct" id="bp${uid}">0%</span>
    <span class="bar-ok" id="bk${uid}"></span>`;
  out.appendChild(row);
  const bi=document.getElementById('bi'+uid);
  const bp=document.getElementById('bp'+uid);
  const bk=document.getElementById('bk'+uid);
  for(let i=1;i<=steps;i++){
    bi.style.width=(i/steps*100)+'%';
    bp.textContent=Math.round(i/steps*100)+'%';
    scroll(); await s(dt);
  }
  bk.textContent='✓'; bk.style.color='#00ffff';
}

function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function rIP(){ return `${rnd(10,199)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`; }
function rMAC(){ return Array.from({length:6},()=>('0'+rnd(0,255).toString(16).toUpperCase()).slice(-2)).join(':'); }
function rHex(){ let h=''; for(let i=0;i<16;i++) h+=('0'+rnd(0,255).toString(16).toUpperCase()).slice(-2)+' '; return h; }
const MC='アイウエオABCDEF0123456789@#$%&*';
function mLine(){ let h=''; for(let i=0;i<52;i++) h+=MC[rnd(0,MC.length-1)]; return h; }

function trimLines(){
  const lines = out.querySelectorAll('.line,.bar-row');
  if(lines.length > 160) for(let i=0;i<lines.length-120;i++) lines[i].remove();
}

// ── Timer ──
function startTimer(label, minutes=30){
  const endTime = Date.now() + minutes*60*1000;
  timerBar.style.display='block';
  timerBar.style.color='#00ffff';
  const prompt = document.getElementById('input-prompt');
  timerInterval = setInterval(()=>{
    const rem=Math.max(0,endTime-Date.now());
    const m=String(Math.floor(rem/60000)).padStart(2,'0');
    const sc=String(Math.floor((rem%60000)/1000)).padStart(2,'0');
    timerBar.textContent=`⏱ ${label}  |  Remaining: ${m}:${sc}`;
    if(prompt) prompt.innerHTML=`<span style="color:#ffe600;font-size:10px">[${m}:${sc}]</span> <span style="color:#00ffff">root@cyber:~$</span>&nbsp;`;
    if(rem===0){ clearInterval(timerInterval); running=false; }
  },1000);
  return endTime;
}
function stopTimer(){
  clearInterval(timerInterval);
  const prompt = document.getElementById('input-prompt');
  if(prompt) prompt.innerHTML='root@cyber:~$&nbsp;';
  setTimeout(()=>{ timerBar.style.display='none'; },2000);
}

// ── waitForInput ──
// allowed = null (any input) or array of allowed values
// maskMode = true for password masking
function waitForInput(allowed=null, maskMode=false){
  return new Promise(resolve => {
    const d = document.createElement('div');
    d.className = 'line dim';
    d.textContent = '  > ';
    out.appendChild(d); scroll();

    // temporarily disable main handler
    inp.setAttribute('data-waiting','1');

    function onKey(e){
      if(e.key !== 'Enter') return;
      const val = inp.value.trim();
      inp.value = '';
      if(allowed && !allowed.includes(val.toLowerCase())){
        add(`<span class="red">  Invalid. Type: ${allowed.join(' / ')}</span>`);
        return;
      }
      inp.removeEventListener('keydown', onKey);
      inp.removeEventListener('input', onInp);
      d.remove();
      inp.removeAttribute('data-waiting');
      resolve(val);
    }
    function onInp(){
      const v = inp.value;
      d.textContent = maskMode ? '  > ' + '•'.repeat(v.length) : '  > ' + v;
      scroll();
    }
    inp.addEventListener('keydown', onKey);
    inp.addEventListener('input', onInp);
  });
}

// ── Menu ──
function showMenu(){
  add('');
  add('<span class="cyan bold">════════════════════════════════════════════════</span>');
  add('<span class="cyan bold">          █ CYBER TERMINAL v1.0 █</span>');
  add('<span class="cyan bold">════════════════════════════════════════════════</span>');
  add('');
  add('<span class="cyan">[1]  Hydra Dongle</span>');
  add('<span class="cyan">[2]  THC Hydra Cyber Security</span>');
  add('<span class="cyan">[3]  Disconnect Device</span>');
  add('<span class="cyan">[4]  Device Remove</span>');
  add('<span class="red">[0]  Exit</span>');
  add('');
  add('<span class="dim">Type a number and press Enter...</span>');
}

// ── Main input handler ──
inp.addEventListener('keydown', async (e)=>{
  if(e.key !== 'Enter') return;
  if(inp.getAttribute('data-waiting')) return; // waitForInput is active
  const val = inp.value.trim();
  inp.value = '';
  if(!val) return;

  const cmd = val.toLowerCase();

  if(cmd === 'stop' || cmd === '0'){
    add(`<span class="yellow">▶ ${val}</span>`);
    if(busy){
      running = false;
      stopTimer();
      spHide();
      add('<span class="red bold">[ STOPPED ]</span>');
      await s(800);
      busy = false;
      showMenu();
    } else {
      await exitTerminal();
    }
    return;
  }

  if(cmd === 'start'){
    add(`<span class="yellow">▶ ${val}</span>`);
    if(busy){ running=false; stopTimer(); busy=false; }
    await s(300);
    showMenu();
    return;
  }

  add(`<span class="yellow">▶ ${val}</span>`);
  if(busy) return;

  if(val==='1'){ busy=true; await option1(); busy=false; showMenu(); }
  else if(val==='2'){ busy=true; await option2(); busy=false; showMenu(); }
  else if(val==='3'){ busy=true; await option3(); busy=false; showMenu(); }
  else if(val==='4'){ busy=true; await option4(); busy=false; showMenu(); }
  else { add(`<span class="red">Invalid command.</span>`); }
});

// ══════════════════════════════════════
// COMMON PHASES
// ══════════════════════════════════════
async function phaseInit(label){
  await type(`Initializing ${label}...`,'cyan',90);
  await bar('Init Modules',rnd(18,26),rnd(180,240));
}
async function phaseUSBScan(){
  await type('Scanning USB Ports...','cyan',90);
  await s(800);
  for(let i=1;i<=4;i++){
    const found=(i===rnd(2,4));
    add(`<span class="dim">  USB Port ${i}: ${found?'<span style="color:#00ff41">DEVICE FOUND</span>':'No device'}</span>`);
    await s(700);
  }
}
async function phaseDriverCheck(){
  await type('Checking Drivers...','cyan',90);
  await bar('Driver Verification',rnd(16,22),rnd(180,230));
  add(`<span class="green">  ✓ Driver OK — Serial: HD-${rnd(1000,9999)}-XXXX</span>`);
}
async function phaseConnect(){
  await type('Connecting...','cyan',90);
  await bar('Establishing Connection',rnd(18,26),rnd(180,220));
  add(`<span class="green">  ✓ Connected — Token: 0x${rnd(1000,65535).toString(16).toUpperCase()}</span>`);
}
async function phaseDataStream(){
  await type('Reading Data Stream...','cyan',90);
  await s(700);
  for(let i=0;i<rnd(5,9);i++){
    add(`<span class="dim">  DATA[${String(i).padStart(3,'0')}]: ${rHex()}</span>`);
    await s(500);
  }
}
async function phaseNetworkProbe(){
  await type('Probing Network Nodes...','cyan',90);
  await s(700);
  for(let i=0;i<rnd(4,7);i++){
    const open=rnd(0,1);
    add(`<span class="dim">  ${rIP()}:${rnd(20,9999)} — ${open?'<span style="color:#00ff41">OPEN</span>':'<span style="color:#ff3c3c">CLOSED</span>'}</span>`);
    await s(600);
  }
}
async function phaseMatrixRain(){
  await type('Signal Trace Active...','cyan',90);
  await s(700);
  for(let i=0;i<rnd(7,12);i++){
    const op=(0.3+Math.random()*0.7).toFixed(2);
    add(`<span style="color:#00ff41;opacity:${op}">${mLine()}</span>`);
    await s(280);
  }
}
async function phaseReconnect(){
  await type('Re-Authenticating...','yellow',90);
  await bar('Re-Authentication',rnd(16,22),rnd(180,230));
  add(`<span class="green">  ✓ Token: 0x${rnd(1000,9999).toString(16).toUpperCase()} Refreshed</span>`);
}
async function phasePacketAnalysis(){
  await type('Analyzing Packets...','cyan',90);
  await bar('Packet Analysis',rnd(18,26),rnd(180,220));
  add(`<span class="dim">  Scanned: ${rnd(100,9999)} pkts — Flagged: ${rnd(0,4)}</span>`);
}
async function phaseEncryption(){
  await type('Encrypting Channel...','cyan',90);
  await bar('AES-256 Encryption',rnd(20,28),rnd(175,215));
  add('<span class="green">  ✓ Secure tunnel established</span>');
}
async function phasePortScan(){
  await type('Running Port Scan...','cyan',90);
  await s(700);
  const ports=[22,80,443,8080,3306,3389,21,25];
  for(let p of ports){
    const st=rnd(0,2);
    const col=st===0?'#00ff41':st===1?'#ffe600':'#ff3c3c';
    const label=st===0?'OPEN':st===1?'FILTERED':'CLOSED';
    add(`<span class="dim">  Port <span style="color:#00ffff">${String(p).padEnd(6,' ')}</span> <span style="color:${col}">${label}</span></span>`);
    await s(500);
  }
}
async function phaseAuthCheck(){
  await type('Auth Verification...','cyan',90);
  await s(700);
  for(let i=1;i<=4;i++){
    const ok=i===4;
    add(`<span class="${ok?'green':'dim'}">  Check ${i}: ${ok?'<span style="color:#00ff41">✓ VERIFIED</span>':'○ Processing...'}</span>`);
    await s(800);
  }
}

const allPhases = [
  ()=>phaseInit('System'), phaseUSBScan, phaseDriverCheck, phaseConnect,
  phaseDataStream, phaseNetworkProbe, phaseMatrixRain,
  phaseReconnect, phasePacketAnalysis, phaseEncryption,
  phase
