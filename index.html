<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cyber Terminal v1.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; width:100%; }
  body {
    background:#000;
    color:#00ff41;
    font-family:'Courier New', Courier, monospace;
    font-size:13px;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:6px;
    overflow:hidden;
  }
  #terminal {
    width:100%;
    max-width:700px;
    background:#000;
    border:2px solid #00ff41;
    box-shadow:0 0 18px #00ff41aa, 0 0 40px #00ff4133;
    padding:12px 14px;
    height:calc(100dvh - 24px);
    max-height:98vh;
    display:flex;
    flex-direction:column;
  }
  .scanline {
    pointer-events:none;
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    background:repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
    );
    z-index:999;
  }
  #out {
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    margin-bottom:6px;
    scroll-behavior:smooth;
  }
  #out::-webkit-scrollbar { width:3px; }
  #out::-webkit-scrollbar-thumb { background:#00ff4155; }
  .line {
    margin:2px 0;
    white-space:pre-wrap;
    word-break:break-all;
    line-height:1.55;
    font-size:clamp(11px, 2.8vw, 14px);
  }
  .cyan   { color:#00ffff; }
  .yellow { color:#ffe600; }
  .red    { color:#ff3c3c; }
  .green  { color:#00ff41; }
  .dim    { color:#007a20; }
  .bold   { font-weight:bold; }

  #input-row {
    display:flex;
    align-items:center;
    border-top:1px solid #00ff4166;
    padding-top:6px;
    gap:5px;
    flex-shrink:0;
  }
  #input-prompt {
    color:#00ffff;
    white-space:nowrap;
    font-size:clamp(11px, 2.8vw, 14px);
  }
  #cmd-input {
    flex:1;
    background:#000;
    color:#00ff41;
    border:none;
    outline:none;
    font-family:'Courier New', Courier, monospace;
    font-size:clamp(11px, 2.8vw, 14px);
    caret-color:#00ff41;
    min-width:0;
    /* prevent iOS zoom on focus */
    font-size:16px;
  }
  /* fix iOS zoom: keep display size small via transform */
  @media (max-width: 600px) {
    #cmd-input { font-size:16px; }
    .line { font-size:12px; }
    #input-prompt { font-size:12px; }
  }

  #timer-bar {
    display:none;
    background:#001a00;
    border:1px solid #00ff41;
    padding:4px 8px;
    margin-bottom:5px;
    font-size:clamp(10px,2.5vw,12px);
    color:#00ffff;
    text-align:center;
    letter-spacing:1px;
    flex-shrink:0;
    word-break:break-all;
  }

  .bar-row {
    display:flex;
    align-items:center;
    gap:4px;
    margin:2px 0;
    flex-wrap:wrap;
  }
  .bar-outer {
    flex:1;
    min-width:80px;
    max-width:180px;
    background:#001a00;
    border:1px solid #00ff41;
    height:12px;
  }
  .bar-pct { width:32px; text-align:right; color:#00ff41; font-size:11px; }
  .bar-ok  { color:#00ffff; margin-left:3px; font-size:11px; }

  /* ── Main row: output + panel ── */
  #main-row {
    flex:1;
    display:flex;
    flex-direction:row;
    gap:5px;
    overflow:hidden;
    min-height:0;
    margin-bottom:6px;
  }
  #out {
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
    min-width:0;
  }
  #out::-webkit-scrollbar { width:3px; }
  #out::-webkit-scrollbar-thumb { background:#00ff4155; }

  /* ── Info Panel (inside terminal, right side) ── */
  #info-panel {
    display:none;
    width:190px;
    flex-shrink:0;
    background:#000d00;
    border:1px solid #00ff4155;
    border-radius:2px;
    padding:5px 5px 4px 5px;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    font-family:'Courier New',Courier,monospace;
    font-size:10px;
    color:#00ff41;
  }
  #info-panel::-webkit-scrollbar { width:2px; }
  #info-panel::-webkit-scrollbar-thumb { background:#00ff4144; }
  .sp-title {
    color:#00ffff;
    font-size:10px;
    font-weight:bold;
    text-align:center;
    border-bottom:1px solid #00ffff55;
    padding-bottom:3px;
    margin-bottom:3px;
    letter-spacing:1px;
  }
  .sp-section {
    color:#00ffff;
    font-size:9px;
    font-weight:bold;
    margin:4px 0 1px 0;
    border-left:2px solid #00ffff;
    padding-left:3px;
    letter-spacing:0.5px;
  }
  .sp-row {
    font-size:9px;
    color:#00ff41;
    padding:1px 0;
    word-break:break-all;
    border-bottom:1px solid #00ff4115;
    line-height:1.4;
  }
  .sp-row.locked  { color:#ff3c3c; }
  .sp-row.removed { color:#007a20; text-decoration:line-through; }
  .sp-row.cyan-row{ color:#00ffff; }
  .sp-status {
    text-align:center;
    margin-top:4px;
    font-size:9px;
    font-weight:bold;
    color:#ff3c3c;
    border:1px solid #ff3c3c44;
    padding:2px 0;
    letter-spacing:1px;
    animation: spblink 1s step-start infinite;
  }
  #sp-radar { display:none; text-align:center; margin:6px 0; padding:6px 3px; border:1px solid #00ff4155; background:#001000; }
  .radar-scope { width:104px; height:104px; margin:0 auto 5px; position:relative; overflow:hidden; border:1px solid #00ff41; border-radius:50%; background:repeating-radial-gradient(circle, transparent 0 16px, #00ff4144 17px 18px), linear-gradient(90deg, transparent 49.5%, #00ff4133 50%, transparent 50.5%), linear-gradient(transparent 49.5%, #00ff4133 50%, transparent 50.5%); box-shadow:0 0 10px #00ff4155; }
  .radar-scope::before { content:''; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, transparent 0deg 300deg, #00ff4166 360deg); animation:radarSweep 2s linear infinite; }
  .radar-dot { position:absolute; width:6px; height:6px; border-radius:50%; background:#ff253a; box-shadow:0 0 7px #ff253a,0 0 14px #ff001e; animation:radarPulse 1.2s ease-in-out infinite; }
  #sp-radar-label { color:#00ffff; font-size:9px; font-weight:bold; letter-spacing:1px; }
  @keyframes radarSweep { to { transform:rotate(360deg); } }
  @keyframes radarPulse { 50% { opacity:.25; transform:scale(.65); } }  @keyframes spblink { 50%{ opacity:0; } }
  @media (max-width:600px) { #info-panel { width:42%; min-width:130px; } }
  .terminal-toolbar { display:flex; align-items:center; gap:7px; flex-shrink:0; margin-bottom:6px; }
  #sound-toggle { flex:0 0 auto; min-height:36px; padding:6px 10px; border:1px solid #00ff41; border-radius:3px; background:#001400; color:#00ff41; font:600 11px 'Courier New',monospace; cursor:pointer; touch-action:manipulation; }
  #sound-toggle:focus-visible, #sound-test:focus-visible { outline:2px solid #00ffff; outline-offset:2px; }
  #sound-test { flex:0 0 auto; min-height:36px; padding:6px 9px; border:1px solid #00ffff88; border-radius:3px; background:#001018; color:#00ffff; font:600 11px 'Courier New',monospace; cursor:pointer; touch-action:manipulation; }
  @media (max-width:700px) {
    body { padding:env(safe-area-inset-top) 5px env(safe-area-inset-bottom); }
    #terminal { height:100dvh; max-height:none; padding:8px; border-width:1px; }
    #main-row { flex-direction:column; gap:5px; }
    #info-panel { order:0; width:100%; min-width:0; flex:0 0 min(28dvh,210px); }
    #out { order:1; flex:1 1 auto; min-height:0; }
    .radar-scope { width:82px; height:82px; }
    #sp-radar { margin:3px 0; padding:3px; }
    #sound-toggle { min-height:40px; padding:7px 9px; }
    #timer-bar { min-width:0; padding:5px; letter-spacing:0; font-size:10px; }
    .line { overflow-wrap:anywhere; word-break:normal; }
  }
  @media (max-height:500px) and (orientation:landscape) {
    #main-row { flex-direction:row; }
    #info-panel { order:1; width:min(35vw,190px); flex:0 0 min(35vw,190px); }
    #out { order:0; }
    .radar-scope { width:70px; height:70px; }
    #info-panel { font-size:9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior:auto !important; animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="scanline"></div>
<div id="terminal">
  <div class="terminal-toolbar"><div id="timer-bar">⏱ Remaining: --:--</div><button id="sound-toggle" type="button" aria-pressed="true" aria-label="Turn sound effects off">🔊 SOUND ON</button><button id="sound-test" type="button">▶ TEST</button></div>
  <div id="main-row">
    <div id="out"></div>
    <div id="info-panel">
      <div class="sp-title">◉ STATUS PANEL</div>
      <div id="sp-radar"><div class="radar-scope"><span class="radar-dot"></span></div><div id="sp-radar-label">SCANNING</div></div>
      <div id="sp-loc-sec"  class="sp-section" style="display:none">📍 LOCATION</div>
      <div id="sp-loc"></div>
      <div id="sp-users-sec" class="sp-section" style="display:none">👤 USERS</div>
      <div id="sp-users"></div>
      <div id="sp-nums-sec" class="sp-section" style="display:none">📞 NUMBERS</div>
      <div id="sp-nums"></div>
      <div id="sp-social-sec" class="sp-section" style="display:none">🔗 SOCIAL</div>
      <div id="sp-social"></div>
      <div id="sp-dev-sec"  class="sp-section" style="display:none">💻 DEVICES</div>
      <div id="sp-dev"></div>
      <div id="sp-files-sec" class="sp-section" style="display:none">🗂 FILES</div>
      <div id="sp-files"></div>
      <div id="sp-input-sec" class="sp-section" style="display:none">◉ INPUT STATUS</div><div id="sp-input"></div>
      <div id="sp-places-sec" class="sp-section" style="display:none">📍 NEAR HYDERABAD · SAMPLE</div><div id="sp-places"></div>
      <div id="sp-status" class="sp-status" style="display:none">◉ LOCKED OUT</div>
    </div>
  </div>
  <div id="input-row">
    <span id="input-prompt">root@cyber:~$&nbsp;</span>
    <input id="cmd-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" placeholder="Type and press Enter..." />
  </div>
</div>

<script>
const out      = document.getElementById('out');
const inp      = document.getElementById('cmd-input');
const timerBar = document.getElementById('timer-bar');
const inpRow   = document.getElementById('input-row');
const soundToggle = document.getElementById('sound-toggle');
let soundEnabled = true;
let soundContext = null;
async function playUiSound(kind='tick') {
  if(!soundEnabled) return;
  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor) return;
  try {
    soundContext ||= new AudioCtor();
    if(soundContext.state==='suspended') await soundContext.resume();
    const now=soundContext.currentTime;
    const osc=soundContext.createOscillator();
    const gain=soundContext.createGain();
    const tones={command:520,scan:720,success:880,stop:260};
    osc.type='sine'; osc.frequency.setValueAtTime(tones[kind]||440,now);
    if(kind==='success') osc.frequency.exponentialRampToValueAtTime(1100,now+.09);
    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.16,now+.015);
    gain.gain.exponentialRampToValueAtTime(.0001,now+.20);
    osc.connect(gain); gain.connect(soundContext.destination);
    osc.start(now); osc.stop(now+.21);
  } catch(e) { /* Sound is optional when the browser blocks audio. */ }
}
soundToggle.addEventListener('click',()=>{
  soundEnabled=!soundEnabled;
  soundToggle.textContent=soundEnabled?'🔊 SOUND ON':'🔇 SOUND OFF';
  soundToggle.setAttribute('aria-pressed',String(soundEnabled));
  soundToggle.setAttribute('aria-label',soundEnabled?'Turn sound effects off':'Turn sound effects on');
  if(soundEnabled) playUiSound('success');
});
document.getElementById('sound-test').addEventListener('click',()=>{
  soundEnabled=true;
  soundToggle.textContent='🔊 SOUND ON';
  soundToggle.setAttribute('aria-pressed','true');
  soundToggle.setAttribute('aria-label','Turn sound effects off');
  playUiSound('success');
});

// ── Info Panel refs ──
const infoPanel    = document.getElementById('info-panel');
const spUsers      = document.getElementById('sp-users');
const spUsersSec   = document.getElementById('sp-users-sec');
const spNums       = document.getElementById('sp-nums');
const spNumsSec    = document.getElementById('sp-nums-sec');
const spSocial     = document.getElementById('sp-social');
const spSocialSec  = document.getElementById('sp-social-sec');
const spLoc        = document.getElementById('sp-loc');
const spLocSec     = document.getElementById('sp-loc-sec');
const spDev        = document.getElementById('sp-dev');
const spDevSec     = document.getElementById('sp-dev-sec');
const spFiles      = document.getElementById('sp-files');
const spFilesSec   = document.getElementById('sp-files-sec');
const spStatus     = document.getElementById('sp-status');

const LOCATIONS = ['HYDERABAD','SAMSABAD','SECUNDERABAD','RANGAPOOR','PINCHRALA','CHARMINAR','HYDERABAD CYBER OFFICE','MEDAK'];

function spShow(){ infoPanel.style.display='block'; }
let radarLocationUnlocked=false;
let radarDotCount=1;
function setRadar(on,label='SCANNING',requestedDots=radarDotCount){
  const radar=document.getElementById('sp-radar');
  const scope=radar?.querySelector('.radar-scope');
  const l=document.getElementById('sp-radar-label');
  radarDotCount=radarLocationUnlocked?1:Math.max(1,Math.min(8,requestedDots));
  if(radar) radar.style.display=on?'block':'none';
  if(l) l.textContent=label;
  if(scope){
    scope.querySelectorAll('.radar-dot').forEach(dot=>dot.remove());
    for(let i=0;i<radarDotCount;i++){
      const angle=(-90+i*360/radarDotCount)*Math.PI/180;
      const dot=document.createElement('span');
      dot.className='radar-dot';
      dot.style.left=`${50+37*Math.cos(angle)}%`;
      dot.style.top=`${50+37*Math.sin(angle)}%`;
      dot.style.animationDelay=`${i*.12}s`;
      scope.appendChild(dot);
    }
  }
}
function spHide(){
  infoPanel.style.display='none';
  [spUsers,spNums,spSocial,spLoc,spDev,spFiles].forEach(el=>el.innerHTML='');
  document.getElementById('sp-input').innerHTML=''; document.getElementById('sp-places').innerHTML='';
  [document.getElementById('sp-input-sec'),document.getElementById('sp-places-sec')].forEach(el=>el.style.display='none');
  [spUsersSec,spNumsSec,spSocialSec,spLocSec,spDevSec,spFilesSec].forEach(el=>el.style.display='none');
  spStatus.style.display='none';
  setRadar(false);
}

function spAddRow(container, secEl, text, cls=''){
  secEl.style.display='block';
  const d=document.createElement('div');
  d.className='sp-row'+(cls?' '+cls:'');
  d.textContent=text;
  container.appendChild(d);
  return d;
}

function spAddUser(name){ spAddRow(spUsers, spUsersSec, '✗ '+name, 'locked'); }
function spAddNum(num)  { return spAddRow(spNums, spNumsSec, num); }
function spAddSocial(name){ return spAddRow(spSocial, spSocialSec, '• '+name); }
function spAddLoc(loc)  { spAddRow(spLoc, spLocSec, '📍 '+loc, 'cyan-row'); }
function spAddDev(name, removed=false){ return spAddRow(spDev, spDevSec, (removed?'✗ ':'◈ ')+name, removed?'removed':''); }
function spAddFile(text, removed=false){ return spAddRow(spFiles, spFilesSec, text, removed?'removed':'locked'); }
function spSetStatus(on){ spStatus.style.display=on?'block':'none'; }

function spMarkRemoved(el, text){ if(el){ el.classList.add('removed'); el.textContent='✗ '+text; } }


// Mobile keyboard open hone par scroll fix
inp.addEventListener('focus', ()=>{
  setTimeout(()=>{ scroll(); }, 400);
});

const s = ms => new Promise(r => setTimeout(r, ms));
let running = false;
let timerInterval = null;
let busy = false;

// ── Helpers ──
function scroll(){ out.scrollTop = out.scrollHeight; }

function add(html, cls=''){
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  d.innerHTML = html;
  if(/CURRENT LOCATION STATUS|\[ STOPPED \]|Session Complete|Option [1-5].*\[RUN\]/i.test(html)) playUiSound(/STOPPED/i.test(html)?'stop':/Complete/i.test(html)?'success':'scan');
  out.appendChild(d);
  scroll();
  return d;
}

async function type(text, cls='', delay=90){
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  out.appendChild(d);
  for(let c of text){ d.textContent += c; scroll(); await s(delay); }
}

async function bar(label, steps=22, dt=200, red=false){
  const uid = Math.random().toString(36).slice(2,8);
  const bc = red ? '#ff3c3c' : '#00ff41';
  const lc = red ? '#ff3c3c' : '#00ffff';
  const row = document.createElement('div');
  row.className = 'bar-row';
  row.innerHTML = `<span style="min-width:170px;color:${lc}">${label}</span>
    <div class="bar-outer"><div id="bi${uid}" style="height:100%;background:${bc};box-shadow:0 0 5px ${bc};width:0%"></div></div>
    <span class="bar-pct" id="bp${uid}">0%</span>
    <span class="bar-ok" id="bk${uid}"></span>`;
  out.appendChild(row);
  const bi=document.getElementById('bi'+uid);
  const bp=document.getElementById('bp'+uid);
  const bk=document.getElementById('bk'+uid);
  for(let i=1;i<=steps;i++){
    bi.style.width=(i/steps*100)+'%';
    bp.textContent=Math.round(i/steps*100)+'%';
    scroll(); await s(dt);
  }
  bk.textContent='✓'; bk.style.color='#00ffff';
}

function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function rIP(){ return `${rnd(10,199)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`; }
function rMAC(){ return Array.from({length:6},()=>('0'+rnd(0,255).toString(16).toUpperCase()).slice(-2)).join(':'); }
function rHex(){ let h=''; for(let i=0;i<16;i++) h+=('0'+rnd(0,255).toString(16).toUpperCase()).slice(-2)+' '; return h; }
const MC='アイウエオABCDEF0123456789@#$%&*';
function mLine(){ let h=''; for(let i=0;i<52;i++) h+=MC[rnd(0,MC.length-1)]; return h; }

function trimLines(){
  const lines = out.querySelectorAll('.line,.bar-row');
  if(lines.length > 160) for(let i=0;i<lines.length-120;i++) lines[i].remove();
}

// ── Timer ──
function startTimer(label, minutes=30){
  const endTime = Date.now() + minutes*60*1000;
  timerBar.style.display='block';
  timerBar.style.color='#00ffff';
  const prompt = document.getElementById('input-prompt');
  timerInterval = setInterval(()=>{
    const rem=Math.max(0,endTime-Date.now());
    const m=String(Math.floor(rem/60000)).padStart(2,'0');
    const sc=String(Math.floor((rem%60000)/1000)).padStart(2,'0');
    timerBar.textContent=`⏱ ${label}  |  Remaining: ${m}:${sc}`;
    if(prompt) prompt.innerHTML=`<span style="color:#ffe600;font-size:10px">[${m}:${sc}]</span> <span style="color:#00ffff">root@cyber:~$</span>&nbsp;`;
    if(rem===0){ clearInterval(timerInterval); running=false; window.dispatchEvent(new Event('sessionexpired')); }
  },1000);
  return endTime;
}
function stopTimer(){
  clearInterval(timerInterval);
  const prompt = document.getElementById('input-prompt');
  if(prompt) prompt.innerHTML='root@cyber:~$&nbsp;';
  setTimeout(()=>{ timerBar.style.display='none'; },2000);
}

// ── waitForInput ──
// allowed = null (any input) or array of allowed values
// maskMode = true for password masking
function waitForInput(allowed=null, maskMode=false){
  return new Promise(resolve => {
    const d = document.createElement('div');
    d.className = 'line dim';
    d.textContent = '  > ';
    out.appendChild(d); scroll();

    // temporarily disable main handler
    inp.setAttribute('data-waiting','1');

    function onKey(e){
      if(e.key !== 'Enter') return;
      const val = inp.value.trim();
      inp.value = '';
      if(allowed && !allowed.includes(val.toLowerCase())){
        add(`<span class="red">  Invalid. Type: ${allowed.join(' / ')}</span>`);
        return;
      }
      inp.removeEventListener('keydown', onKey);
      inp.removeEventListener('input', onInp);
      d.remove();
      inp.removeAttribute('data-waiting');
      resolve(val);
    }
    function onInp(){
      const v = inp.value;
      d.textContent = maskMode ? '  > ' + '•'.repeat(v.length) : '  > ' + v;
      scroll();
    }
    inp.addEventListener('keydown', onKey);
    inp.addEventListener('input', onInp);
    inp.focus();
  });
}

// ── Menu ──
function showMenu(){
  add('');
  add('<span class="cyan bold">════════════════════════════════════════════════</span>');
  add('<span class="cyan bold">          █ CYBER TERMINAL v1.0 █</span>');
  add('<span class="cyan bold">════════════════════════════════════════════════</span>');
  add('');
  add('<span class="cyan">[1]  Hydra Dongle</span>');
  add('<span class="cyan">[2]  THC Hydra Cyber Security</span>');
  add('<span class="cyan">[3]  Disconnect Device</span>');
  add('<span class="cyan">[4]  Device Remove</span>');
  add('<span class="yellow">[5]  Username + IP Analysis</span>');
  add('<span class="red">[0]  Exit</span>');
  add('');
  add('<span class="dim">Type a number and press Enter...</span>');
}

// ── Main input handler ──
inp.addEventListener('keydown', async (e)=>{
  if(e.key !== 'Enter') return;
  playUiSound('command');
  if(inp.getAttribute('data-waiting')) return; // waitForInput is active
  const val = inp.value.trim();
  inp.value = '';
  if(!val) return;

  const cmd = val.toLowerCase();

  if(cmd === 'stop' || cmd === '0'){
    add(`<span class="yellow">▶ ${val}</span>`);
    if(busy){
      running = false;
      stopTimer();
      spHide();
      add('<span class="red bold">[ STOPPED ]</span>');
      await s(800);
      busy = false;
      showMenu();
    } else {
      await exitTerminal();
    }
    return;
  }

  if(cmd === 'start'){
    add(`<span class="yellow">▶ ${val}</span>`);
    if(busy){ running=false; stopTimer(); busy=false; }
    await s(300);
    showMenu();
    return;
  }

  add(`<span class="yellow">▶ ${val}</span>`);
  if(busy) return;

  if(val==='1'){ busy=true; await option1(); busy=false; showMenu(); }
  else if(val==='2'){ busy=true; await option2(); busy=false; showMenu(); }
  else if(val==='3'){ busy=true; await option3(); busy=false; showMenu(); }
  else if(val==='4'){ busy=true; await option4(); busy=false; showMenu(); }
  else if(val==='5'){ busy=true; await option5(); busy=false; showMenu(); }
  else { add(`<span class="red">Invalid command.</span>`); }
});

function waitForLocationAnswer(timeoutMs=null){
  return new Promise(resolve=>{
    const d=document.createElement('div'); d.className='line dim'; d.textContent='  > ';
    out.appendChild(d); scroll(); inp.setAttribute('data-waiting','1');
    let timeoutId=null, finished=false;
    function cleanup(value){
      if(finished) return; finished=true;
      if(timeoutId) clearTimeout(timeoutId);
      inp.removeEventListener('keydown',onKey); inp.removeEventListener('input',onInput);
      window.removeEventListener('sessionexpired',onExpired);
      inp.removeAttribute('data-waiting'); inp.value=''; d.remove(); resolve(value);
    }
    function onKey(e){
      if(e.key!=='Enter') return;
      const value=inp.value.trim().toLowerCase().replace(/\s+/g,' ');
      if(['ok','ok lok2','stop','0'].includes(value)){ cleanup(value); return; }
      inp.value=''; d.textContent='  > '; inp.focus();
    }
    function onInput(){ d.textContent='  > '+inp.value; scroll(); }
    function onExpired(){ cleanup('stop'); }
    inp.addEventListener('keydown',onKey); inp.addEventListener('input',onInput);
    window.addEventListener('sessionexpired',onExpired);
    if(timeoutMs!==null) timeoutId=setTimeout(()=>cleanup('timeout'),timeoutMs);
    inp.focus();
  });
}

async function locationStatusPrompt(){
  spShow(); spSetStatus(false);
  while(running){
    add('');
    add('<span class="yellow bold">⚠ CURRENT LOCATION STATUS</span>');
    add('<span class="cyan">Current location: Internet Traffic Area (simulated)</span>');
    add('<span class="red">This location is unavailable. Please try another location.</span>');
    spAddLoc('INTERNET TRAFFIC AREA · SIMULATED');
    const answer=await waitForLocationAnswer();
    if(answer==='ok lok2'){
      radarLocationUnlocked=true;
      setRadar(true,document.getElementById('sp-radar-label')?.textContent||'SCANNING',1);
      add('<span class="green">✓ Location 2 selected. Session continues until the 20-minute timer ends.</span>');
      spAddLoc('LOCATION 2 SELECTED · SIMULATED');
      return 'continue';
    }
    if(answer==='stop'||!running){
      running=false; stopTimer();
      add('<span class="red bold">[ STOPPED ]</span>');
      return 'stop';
    }
    while(running){
      const next=await waitForLocationAnswer(2*60*1000);
      if(next==='ok lok2'){
        radarLocationUnlocked=true;
        setRadar(true,document.getElementById('sp-radar-label')?.textContent||'SCANNING',1);
        add('<span class="green">✓ Location 2 selected. Session continues until the 20-minute timer ends.</span>');
        spAddLoc('LOCATION 2 SELECTED · SIMULATED');
        return 'continue';
      }
      if(next==='stop'||!running){
        running=false; stopTimer();
        add('<span class="red bold">[ STOPPED ]</span>');
        return 'stop';
      }
      if(next==='timeout') break;
    }
  }
  return 'stop';
}
async function runLocationWait(endTime){
  let nextLocationPrompt=Date.now()+2*60*1000;
  let location2Selected=false;
  while(running && Date.now()<endTime){
    if(!location2Selected && Date.now()>=nextLocationPrompt){
      const choice=await locationStatusPrompt();
      if(choice==='stop') break;
      if(choice==='continue') location2Selected=true;
      else nextLocationPrompt=Date.now()+2*60*1000;
    }
    await s(500);
  }
}
async function runCycles(endTime, extraFn=null){
  let cycle=0;
  let nextLocationPrompt=Date.now()+2*60*1000;
  let location2Selected=false;
  async function checkLocationCheckpoint(){
    if(location2Selected || Date.now()<nextLocationPrompt) return false;
    const choice=await locationStatusPrompt();
    if(choice==='stop') return true;
    if(choice==='continue') location2Selected=true;
    else nextLocationPrompt=Date.now()+2*60*1000;
    return false;
  }
  while(running && Date.now()<endTime){
    cycle++;
    add('');
    add(`<span class="dim">── Cycle ${cycle} ──────────────────────────────────</span>`);
    await s(1200);
    if(extraFn){ const done=await extraFn(cycle,endTime); if(done) break; }
    if(await checkLocationCheckpoint()) break;
    if(!running) break;
    const shuffled=[...allPhases].sort(()=>Math.random()-0.5);
    const count=rnd(3,5);
    for(let i=0;i<count;i++){
      if(!running||Date.now()>=endTime) break;
      await shuffled[i]();
      await s(rnd(1500,2500));
      if(await checkLocationCheckpoint()) break;
    }
    trimLines();
    await s(rnd(1500,2500));
  }
}

  add('<span class="cyan bold">════ LINKED MOBILE NUMBERS ════</span>');
  await type('Scanning registered devices...','cyan',70);
  await s(600);
  const phones=buildPhoneList();
  add('<span class="dim">  ┌──────────────────────────────────────────────┐</span>');
  add('<span class="dim">  │  #    Mobile Number             Status        │</span>');
  add('<span class="dim">  ├──────────────────────────────────────────────┤</span>');
  for(let i=0;i<phones.length;i++){
    const p=phones[i];
    const idx=String(i+1).padStart(2,' ');
    const numPad=p.num.padEnd(24,' ');
    const badge=p.fixed
      ? '<span style="color:#ff3c3c">⚠ Masked</span>'
      : '<span style="color:#ffe600">Unknown      </span>';
    add(`<span class="dim">  │ ${idx}. <span style="color:#00ffff">${numPad}</span> ${badge} │</span>`);
    spAddNum(p.num);
    await s(300);
  }
  add('<span class="dim">  └──────────────────────────────────────────────┘</span>');
  await s(600);
  await type('Removing linked numbers...','red',70);
  await s(400);
  for(let i=0;i<phones.length;i++){
    const p=phones[i];
    const idx=String(i+1).padStart(2,' ');
    add(`<span class="dim">  [${idx}/${phones.length}] <span style="color:#ff3c3c">REMOVED</span>  <span style="color:#00ffff">${p.num}</span>${p.fixed?' — <span style="color:#ff3c3c">Aadhar Device</span>':''}</span>`);
    // mark panel row as removed
    const spRow = spNums.querySelectorAll('.sp-row')[i];
    if(spRow){ spRow.classList.add('removed'); spRow.textContent='✗ '+p.num; }
    await s(rnd(250,400));
  }
  await s(500);
  add('<span class="green bold">✓ All linked numbers removed.</span>');
  await s(800);

  await runCycles(endTime, async (cycle, et)=>{
    const elapsed=Date.now()-startTime;

    // ~16 min: Social media + call recordings
    if(!mDone[0] && elapsed>=milestones[0]){
      mDone[0]=true;
      add('');
      add('<span class="cyan bold">════ SOCIAL MEDIA ACCOUNTS ════</span>');
      await type('Scanning linked accounts...','cyan',70);
      await s(500);
      for(let sv of socials){ add(`<span class="cyan">  • ${sv}</span>`); spAddSocial(sv); await s(250); }
      await s(500);
      await type('Removing social media links...','red',70);
      await s(400);
      let spSocialIdx=0;
      for(let sv of socials){
        const uid='sm'+sv.replace(/[\s()]/g,'');
        const row=document.createElement('div');
        row.className='bar-row line';
        row.innerHTML=`<span style="min-width:140px;color:#ff3c3c">${sv}</span>
          <div class="bar-outer" style="max-width:150px">
            <div id="${uid}" style="height:100%;background:#ff3c3c;box-shadow:0 0 5px #ff3c3c;width:0%"></div>
          </div>
          <span class="bar-ok" id="ok${uid}"></span>`;
        out.appendChild(row); scroll();
        const si=document.getElementById(uid);
        const sk=document.getElementById('ok'+uid);
        for(let j=1;j<=20;j++){ si.style.width=(j/20*100)+'%'; scroll(); await s(120); }
        sk.textContent='✓ Removed'; sk.style.color='#00ff41';
        // mark panel social row removed
        const spSRow=spSocial.querySelectorAll('.sp-row')[spSocialIdx++];
        if(spSRow){ spSRow.classList.add('removed'); spSRow.textContent='✗ '+sv; }
        await s(200);
      }
      add('');
      add('<span class="green bold">✓ All social media links removed.</span>');
      await s(800);
      add('');
      add('<span class="cyan bold">════ CALL RECORDINGS ════</span>');
      await type('Scanning call logs...','cyan',70);
      await s(500);
      const callCount=rnd(8,18);
      for(let i=1;i<=callCount;i++){
        const dur=`${rnd(0,59)}:${String(rnd(0,59)).padStart(2,'0')}`;
        add(`<span class="dim">  CALL_REC_${String(i).padStart(3,'0')}.mp3  [${dur}]  — <span style="color:#ff3c3c">DELETING...</span></span>`);
        await s(350);
      }
      await bar('Call Recordings Deleted',22,160,true);
      add(`<span class="green">  ✓ ${callCount} call recordings deleted.</span>`);
      await s(800);
    }

    // ~24 min: Photos 1-85 deleted
    if(!mDone[1] && elapsed>=milestones[1]){
      mDone[1]=true;
      add('');
      add('<span class="cyan bold">════ PHOTO / IMAGE STORAGE ════</span>');
      await type('Scanning image database...','cyan',70);
      await bar('Image Scan',20,150);
      await s(500);
      add(`<span class="cyan">  Total images found: <span style="color:#ffe600">85</span></span>`);
      await s(400);
      await type('Deleting images...','red',70);
      await s(400);
      for(let i=1;i<=85;i++){
        const ext=['jpg','png','jpeg','mp4','gif'][rnd(0,4)];
        const nm=`IMG_${String(i).padStart(4,'0')}_${rnd(1000,9999)}.${ext}`;
        add(`<span class="dim">  [${String(i).padStart(2,' ')}/85] <span style="color:#ff3c3c">DELETED</span>  ${nm}</span>`);
        await s(rnd(180,320));
        trimLines();
      }
      await s(600);
      add('<span class="green bold">✓ All 85 images/files deleted.</span>');
      spAddFile('✗ 85 SCREENSHOTS DEL', true);
      spAddFile('✗ IMAGES DELETED', true);
      await s(800);
    }
    return false;
  });

  stopTimer();
  spHide();
  add('');
  add('<span class="green bold">✓ Option 4 — Session Complete [RUN]</span>');
  add('<span class="dim">(Session complete)</span>');
  await s(800);
}

// ══════════════════════════════════════
// EXIT
// ══════════════════════════════════════
async function exitTerminal(){
  add('');
  await type('Terminating session...','red',45);
  await bar('Shutdown',20,80,true);
  await s(400);
  add('<span class="red bold">[ TERMINAL CLOSED ]</span>');
  add('<span class="dim">Press F5 to reload.</span>');
  inpRow.style.display='none';
}

// ══════════════════════════════════════
// LOGIN SCREEN
// ══════════════════════════════════════
async function showLogin(){
  add('');
  add('<span class="cyan bold">════════════════════════════════════════════════</span>');
  add('<span class="cyan bold">           ■  AUTHENTICATION REQUIRED  ■</span>');
  add('<span class="cyan bold">════════════════════════════════════════════════</span>');
  add('');
  await type('Enter credentials to access terminal.','dim',40);
  add('');

  // Username
  add('<span class="cyan">Username:</span>');
  const uname = await waitForInput(null, false);

  if(uname.toLowerCase() !== 'hydra'){
    add(`<span class="yellow">▶ ${uname}</span>`);
    await type('[ ACCESS DENIED ] — Invalid username.','red',50);
    await s(800);
    await type('Restarting authentication...','dim',40);
    await s(1000);
    out.innerHTML='';
    await showLogin();
    return;
  }

  add(`<span class="yellow">▶ ${uname}</span>`);
  await type('Username accepted.','green',40);
  await s(400);

  // Password
  add('');
  add('<span class="cyan">Password:</span>');
  const pwd = await waitForInput(null, true);

  if(pwd === 'Hyderabad'){
    add('<span class="yellow">▶ ••••••••••••</span>');
    add('');
    add('<span class="green bold">════════════════════════════════════════════════</span>');
    add('<span class="green bold">  ✓  AUTHENTICATION SUCCESSFUL</span>');
    add('<span class="green bold">════════════════════════════════════════════════</span>');
    await s(500);
    add('');
    await type('Running device security check...','cyan',50);
    await bar('Security Scan',24,140);
    await s(400);
    add('');
    add('<span class="green bold">  ✓  DEVICE STATUS : SAFE</span>');
    add('<span class="green">  ✓  All systems clear</span>');
    add('<span class="green">  ✓  No threats detected</span>');
    add('<span class="green">  ✓  Device not connected to any foreign network</span>');
    add('<span class="green">  ✓  No unknown functions running</span>');
    add('<span class="green">  ✓  No foreign devices linked</span>');
    add('<span class="green">  ✓  Device is secured and verified</span>');
    add('');
    add('<span class="cyan bold">════════════════════════════════════════════════</span>');
    add('<span class="cyan bold">  ■  SAFE MODE — All Clear. Device is secure.</span>');
    add('<span class="cyan bold">  ■  No login saved. Device verified.</span>');
    add('<span class="cyan bold">════════════════════════════════════════════════</span>');
    await s(800);
    // No menu — terminal stops here, input hidden
    inpRow.style.display='none';

  } else if(pwd === 'hydraa'){
    add('<span class="yellow">▶ ••••••••••</span>');
    add('');
    add('<span class="green bold">  ✓  AUTHENTICATION SUCCESSFUL</span>');
    await s(500);
    await type('Loading terminal...','cyan',50);
    await s(600);
    showMenu();

  } else {
    add('<span class="yellow">▶ ••••••••</span>');
    await type('[ ACCESS DENIED ] — Incorrect password.','red',50);
    await s(800);
    await type('Restarting authentication...','dim',40);
    await s(1000);
    out.innerHTML='';
    await showLogin();
  }
}

// ══════════════════════════════════════
// BOOT
// ══════════════════════════════════════
async function boot(){
  busy=true;
  await type('Booting Cyber Terminal v1.0...','cyan',42);
  await bar('System Boot',20,85);
  await s(500);
  await showLogin();
  busy=false;
}
boot();
</script>
